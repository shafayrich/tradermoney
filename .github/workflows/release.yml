name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------------------
  # Windows Build (64-bit)
  # -------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pywebview flask flask-cors yfinance pandas requests alpaca-trade-api numpy cryptography ib_insync pyinstaller
          pip install python-binance pybit okx
          pip install fpdf websocket-client

      - name: Build with PyInstaller (Windows)
        shell: pwsh
        run: |
          $iconArg = ""
          if (Test-Path "icon.ico") { $iconArg = "--icon=icon.ico" }
          pyinstaller --onedir --windowed --name "TraderMoney" `
            --add-data "app.py;." `
            --collect-all pywebview --collect-all yfinance --collect-all pandas --collect-all cryptography `
            --copy-metadata yfinance --copy-metadata pandas `
            --hidden-import=alpaca_trade_api --hidden-import=ib_insync --hidden-import=binance.client `
            --hidden-import=pybit.unified_trading --hidden-import=okx.Account --hidden-import=okx.Trade `
            --hidden-import=flask --hidden-import=flask_cors --hidden-import=cryptography.fernet `
            --hidden-import=yfinance --hidden-import=pandas --hidden-import=numpy --hidden-import=fpdf `
            --hidden-import=websocket --hidden-import=zoneinfo --hidden-import=asyncio `
            --hidden-import=pandas._libs.tslibs.base `
            $iconArg app.py

      - name: Package as ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\TraderMoney -DestinationPath TraderMoney_Windows.zip

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: TraderMoney_Windows.zip
          token: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------------------
  # macOS Universal2 (works on both Intel and Apple Silicon)
  # -------------------------------------------------------------------------
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pywebview flask flask-cors yfinance pandas requests alpaca-trade-api numpy cryptography ib_insync pyinstaller
          pip install python-binance pybit okx
          pip install fpdf websocket-client

      - name: Build with PyInstaller (macOS universal2)
        run: |
          ICON=""
          if [ -f icon.icns ]; then ICON="--icon=icon.icns"; fi
          pyinstaller --onedir --windowed --name "TraderMoney" \
            --add-data "app.py:." \
            --collect-all pywebview --collect-all yfinance --collect-all pandas --collect-all cryptography \
            --copy-metadata yfinance --copy-metadata pandas \
            --target-architecture universal2 \
            --codesign-identity - \
            --osx-bundle-identifier com.tradermoney.app \
            $ICON \
            --hidden-import=alpaca_trade_api --hidden-import=ib_insync --hidden-import=binance.client \
            --hidden-import=pybit.unified_trading --hidden-import=okx.Account --hidden-import=okx.Trade \
            --hidden-import=flask --hidden-import=flask_cors --hidden-import=cryptography.fernet \
            --hidden-import=yfinance --hidden-import=pandas --hidden-import=numpy --hidden-import=fpdf \
            --hidden-import=websocket --hidden-import=zoneinfo --hidden-import=asyncio \
            --hidden-import=pandas._libs.tslibs.base \
            app.py

      - name: Strip code signatures (unsigned builds)
        run: |
          find dist/TraderMoney.app -type f \( -name "Python" -o -name "*.dylib" -o -name "*.so" \) -exec codesign --remove-signature {} \; 2>/dev/null || true
          codesign --remove-signature dist/TraderMoney.app/Contents/MacOS/TraderMoney 2>/dev/null || true

      - name: Package as tar.gz
        run: cd dist && tar -czf ../TraderMoney_macOS_universal.tar.gz TraderMoney.app

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: TraderMoney_macOS_universal.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
